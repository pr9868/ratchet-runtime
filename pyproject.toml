[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ratchet-runtime"
version = "0.6.0a1"
description = "Execution-safety runtime for unattended agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pradeep Kaushik" }]
keywords = ["agents", "workflow", "reliability", "idempotency", "fencing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pr9868/ratchet-runtime"
Documentation = "https://github.com/pr9868/ratchet-runtime/tree/main/docs"
Source = "https://github.com/pr9868/ratchet-runtime"
Issues = "https://github.com/pr9868/ratchet-runtime/issues"

[tool.setuptools]
py-modules = ["ratchet_runtime"]
package-dir = { "" = "src" }

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ratchet_sqlite*"]
