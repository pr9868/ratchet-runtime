name: conformance

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -B tests/test_conformance.py
      - run: python3 -m pip install .
      - run: python3 -c "import ratchet_runtime; assert ratchet_runtime.__version__ == '0.5.0a2'"
      - run: python3 examples/effect_recovery.py
