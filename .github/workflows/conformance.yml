name: public-release-checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest PyYAML build
      - run: python -B tests/test_conformance.py
      - run: python -B -m pytest -q tests/sqlite
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: python -c "import ratchet_runtime, ratchet_sqlite; assert ratchet_runtime.__version__ == '0.6.0a1'"
      - run: python examples/effect_recovery.py
      - run: python examples/sqlite_commit.py
      - run: python scripts/check_release.py
