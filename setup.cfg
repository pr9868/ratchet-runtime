[metadata]
name = ratchet-runtime
version = 0.5.0a1
description = Execution-safety runtime for unattended agent workflows
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Pradeep Kaushik
url = https://github.com/pr9868/ratchet-runtime
project_urls =
    Documentation = https://github.com/pr9868/ratchet-runtime/tree/main/docs
    Source = https://github.com/pr9868/ratchet-runtime
    Issues = https://github.com/pr9868/ratchet-runtime/issues
classifiers =
    Development Status :: 3 - Alpha
    License :: OSI Approved :: MIT License
    Operating System :: POSIX
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only

[options]
python_requires = >=3.9
py_modules = ratchet_runtime
package_dir =
    = src
